# Local override: build web_server from local ../../web source instead of
# pulling the published onyxdotapp/onyx-web-server image. Use alongside the
# base + dev compose files:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.local-build.yml build web_server
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.local-build.yml up -d web_server

services:
  web_server:
    image: !reset null
    build:
      context: ../../web
      dockerfile: Dockerfile
